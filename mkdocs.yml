site_name: gmail-parser
repo_url: https://github.com/your/repo
strict: true
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
  - mkdocs-jupyter
nav:
  - Home: index.md
  - API: reference.md
extra_css:
  - styles/brand.css
